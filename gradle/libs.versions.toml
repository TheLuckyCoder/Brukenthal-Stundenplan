[versions]
agp = "9.4.0"
kotlin_base = "2.4.20"
kotlin_ksp = "2.3.12"
kotlin_coroutines = "1.11.0"
compose_bom = "2026.09.00"
lifecycleViewmodelCompose = "2.11.0"
retrofit = "3.0.0"
subsamplingScaleImageView = "3.10.0"
voyager = "2.2.21-1.10.3"
google_services = "4.5.0"
firebase_bom = "34.19.0"

androidx_room = "2.8.5"
androidx_activity = "1.13.0"
androidx_datastore = "1.2.1"
androidx_splash = "1.2.0"
androidx_browser = "1.10.0"

[plugins]
android_application = { id = "com.android.application", version.ref = "agp" }
android_library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "kotlin_ksp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin_base" }
google-services = { id = "com.google.gms.google-services", version.ref = "google_services" }

[libraries]
kotlin_coroutines_android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlin_coroutines" }
kotlin_coroutines_playServices = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "kotlin_coroutines" }

androidX_activity = { module = "androidx.activity:activity", version.ref = "androidx_activity" }
androidX_dataStore = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx_datastore" }
androidX_splash = { module = "androidx.core:core-splashscreen", version.ref = "androidx_splash" }
androidX_browser = { module = "androidx.browser:browser", version.ref = "androidx_browser" }

compose_bom = { module = "androidx.compose:compose-bom", version.ref = "compose_bom" }
compose_foundation = { module = "androidx.compose.foundation:foundation" }
compose_ui = { module = "androidx.compose.ui:ui" }
compose_material3 = { module = "androidx.compose.material3:material3" }
compose_animationGraphics = { module = "androidx.compose.animation:animation-graphics" }
compose_tooling = { module = "androidx.compose.ui:ui-tooling" }
compose_toolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
lifecycleViewmodelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
subsamplingScaleImageView = { module = "com.davemorrissey.labs:subsampling-scale-image-view-androidx", version.ref = "subsamplingScaleImageView" }
voyager_navigator = { module = "cafe.adriel.voyager:voyager-navigator", version.ref = "voyager" }

firebase_bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase_bom" }
firebase_config = { module = "com.google.firebase:firebase-config" }
firebase_messaging = { module = "com.google.firebase:firebase-messaging" }

room_runtime = { module = "androidx.room:room-runtime", version.ref = "androidx_room" }
room_compiler = { module = "androidx.room:room-compiler", version.ref = "androidx_room" }
